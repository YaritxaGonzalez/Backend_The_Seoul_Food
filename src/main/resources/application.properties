spring.application.name=seoulfood-backend
spring.profiles.active=local

# --- Neon PostgreSQL ---
spring.datasource.url=jdbc:postgresql://ep-autumn-darkness-b6airphp.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Pool (por el autosuspend de Neon) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html


jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
seed.password=${SEED_PASSWORD}